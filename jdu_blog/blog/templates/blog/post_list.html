<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Postlar ro'yxati</title>
</head>
<body>
    <h1>Barcha Postlar</h1>

    <ul>
        {% for post in posts %}
            <li>
                <!-- 5-topshiriq: Dinamik detail sahifasiga havola -->
                <h3>
                    <a href="{% url 'post_detail' post.id %}">
                        {{ post.title }}
                    </a>
                </h3>
                <p>{{ post.content|truncatewords:20 }}</p>
                <small>{{ post.created_at }}</small>
            </li>
            <hr>
        {% empty %}
            <li>Hozircha postlar mavjud emas.</li>
        {% endfor %}
    </ul>
    <h1>Barcha Postlar</h1>
    <p><a href="{% url 'post_create' %}">+ Yangi post yaratish</a></p>
</body>
</html>
