<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Yangi Post Yaratish</title>
    <style>
        .errorlist {
            color: red;
            font-weight: bold;
            margin: 5px 0;
            padding-left: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea {
            width: 100%;
            max-width: 500px;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 8px 16px;
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <a href="{% url 'post_list' %}">&larr; Barcha postlarga qaytish</a>
    <h1>Yangi Post Yaratish</h1>

    <form method="POST" novalidate>
        {% csrf_token %}

        {% if form.errors %}
            <p style="color: red;">Iltimos, kiritilgan ma'lumotlardagi xatoliklarni to'g'rilang!</p>
        {% endif %}

        <div class="form-group">
            <label for="{{ form.title.id_for_label }}">Sarlavha:</label>
            {{ form.title }}
            {{ form.title.errors }}
        </div>

        <div class="form-group">
            <label for="{{ form.content.id_for_label }}">Matn:</label>
            {{ form.content }}
            {{ form.content.errors }}
        </div>

        <button type="submit">Saqlash</button>
    </form>
</body>
</html>
